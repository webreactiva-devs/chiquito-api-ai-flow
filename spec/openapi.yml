openapi: 3.0.4
info:
  title: Chiquito API
  description: API to get phrases and jokes from the legendary Chiquito de la Calzada
  version: 2.0.0
  contact:
    name: Chiquito API
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Development server

paths:
  /health:
    get:
      summary: Health check
      description: Returns the API health status
      tags:
        - Health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/jokes:
    get:
      summary: Get all jokes
      description: Returns a list of all available jokes, with an option to filter by category
      tags:
        - Jokes
      parameters:
        - name: category
          in: query
          description: Filter jokes by category
          required: false
          schema:
            type: string
            example: "clásico"
      responses:
        '200':
          description: List of jokes retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Joke'

  /api/jokes/random:
    get:
      summary: Get a random joke
      description: Returns a randomly selected joke from the entire collection. Increments view count.
      tags:
        - Jokes
      responses:
        '200':
          description: Random joke retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JokeWithStats'

  /api/jokes/{id}:
    get:
      summary: Get a joke by ID
      description: Returns a specific joke based on its unique ID. Increments view count.
      tags:
        - Jokes
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the joke
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Joke found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JokeWithStats'
        '404':
          description: Joke not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jokes/{id}/vote:
    post:
      summary: Vote on a joke
      description: Register an upvote or downvote for a specific joke
      tags:
        - Votes
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the joke
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: Vote registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'
        '400':
          description: Invalid vote type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Joke not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jokes/{id}/votes:
    get:
      summary: Get vote counts for a joke
      description: Returns the upvote and downvote counts for a specific joke
      tags:
        - Votes
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the joke
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Vote counts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'
        '404':
          description: Joke not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/categories:
    get:
      summary: Get all joke categories
      description: Returns a list of all available joke categories with the count of jokes in each category
      tags:
        - Categories
      responses:
        '200':
          description: List of categories retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          description: Server error retrieving categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stats:
    get:
      summary: Get global statistics
      description: Returns global statistics including total jokes, votes, and views
      tags:
        - Statistics
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalStats'

  /api/stats/top:
    get:
      summary: Get top ranked jokes
      description: Returns jokes ranked by views or votes
      tags:
        - Statistics
      parameters:
        - name: by
          in: query
          description: Ranking criteria
          required: false
          schema:
            type: string
            enum: [views, votes]
            default: views
        - name: limit
          in: query
          description: Maximum number of results
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Top jokes retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JokeWithStats'

components:
  schemas:
    Health:
      type: object
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: string
          example: "OK"
        message:
          type: string
          example: "Fistro pecador de la pradera"
        timestamp:
          type: string
          format: date-time

    Joke:
      type: object
      required:
        - id
        - type
        - content
        - category
      properties:
        id:
          type: integer
          description: Unique joke identifier
          minimum: 1
          example: 1
        type:
          type: string
          description: Type of joke content
          example: "phrase"
        content:
          type: string
          description: Joke or phrase content
          example: "¡Hasta luego, Lucas!"
        category:
          type: string
          description: Category to which the joke belongs
          example: "clásico"

    JokeWithStats:
      allOf:
        - $ref: '#/components/schemas/Joke'
        - type: object
          properties:
            views:
              type: integer
              description: Number of times this joke has been viewed
              example: 42
            score:
              type: integer
              description: Vote score (upvotes - downvotes)
              example: 5
            votes:
              $ref: '#/components/schemas/VoteResponse'

    VoteRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [up, down]
          description: Type of vote
          example: "up"

    VoteResponse:
      type: object
      required:
        - upvotes
        - downvotes
        - score
      properties:
        upvotes:
          type: integer
          description: Number of upvotes
          example: 10
        downvotes:
          type: integer
          description: Number of downvotes
          example: 2
        score:
          type: integer
          description: Net score (upvotes - downvotes)
          example: 8

    Category:
      type: object
      required:
        - name
        - count
      properties:
        name:
          type: string
          description: Category name
          example: "clásico"
        count:
          type: integer
          description: Number of jokes in this category
          minimum: 0
          example: 10

    GlobalStats:
      type: object
      required:
        - totalJokes
        - totalVotes
        - totalViews
      properties:
        totalJokes:
          type: integer
          description: Total number of jokes in the database
          example: 17
        totalVotes:
          type: integer
          description: Total number of votes cast
          example: 150
        totalViews:
          type: integer
          description: Total number of joke views
          example: 1000

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Descriptive error message
          example: "Joke not found, fistro"

tags:
  - name: Health
    description: API health check
  - name: Jokes
    description: Operations related to managing and retrieving jokes
  - name: Votes
    description: Operations related to voting on jokes
  - name: Categories
    description: Operations related to joke categories
  - name: Statistics
    description: Operations related to usage statistics and rankings
